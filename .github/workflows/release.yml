# Every push to main produces a bootable Raspberry Pi card image and publishes it as a
# release called "build @<commit>", so any commit can be written to an SD card and tried
# on real hardware without building anything locally.

name: build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain and image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu parted dosfstools mtools qemu-system-arm

      - name: Build kernel8.img
        run: make -f Makefile.arm64

      - name: Fetch the Raspberry Pi firmware
        # The GPU firmware is what loads our kernel; including it makes the image boot on a
        # blank card. Only the few files a Pi actually reads are fetched, not the whole repo.
        run: |
          mkdir -p firmware
          base=https://raw.githubusercontent.com/raspberrypi/firmware/stable/boot
          for f in bootcode.bin start.elf start4.elf fixup.dat fixup4.dat \
                   bcm2710-rpi-3-b.dtb bcm2711-rpi-4-b.dtb; do
            curl -sfSL "$base/$f" -o "firmware/$f" || echo "skipped $f"
          done
          ls -la firmware

      - name: Smoke-test the kernel in the Raspberry Pi emulator
        # A release that cannot boot is worse than no release, so the image is published
        # only after the emulated Pi has reached C, turned the MMU on, started its timer,
        # read an SD card and enumerated a USB device.
        run: |
          truncate -s 64M test.img
          parted -s test.img mklabel msdos
          parted -s test.img mkpart primary fat32 1MiB 100%
          ( sleep 8; printf 'sd\nusb\nuptime\npy import pi; print("py", pi.board())\n'; sleep 12 ) | \
            timeout 60 qemu-system-aarch64 -M raspi3b -kernel kernel8.img \
              -serial stdio -display none \
              -drive file=test.img,if=sd,format=raw \
              -device usb-net,netdev=n0 -netdev user,id=n0 > boot.log 2>&1 || true
          cat boot.log
          grep -q "early boot reached C"        boot.log
          grep -q "MMU on, caches enabled"      boot.log
          grep -q "interrupts and timer"        boot.log
          grep -q "card: 64 MB"                 boot.log
          grep -q "2 device(s)"                 boot.log
          grep -q "py Raspberry Pi"              boot.log

      - name: Network smoke test
        # The x86 kernel's TCP/IP stack runs on the board. QEMU's user-mode network gives the
        # emulated Pi a USB Ethernet adapter; DHCP, ARP, ICMP and a WebSocket echo to the host
        # must all work. (The full internet run -- DNS, HTTPS, SNTP -- is tools/test/nettest.sh,
        # kept out of CI so a flaky outside site cannot block a release.)
        run: |
          python3 tools/test/wsecho.py 18080 &
          sleep 1
          truncate -s 64M net.img
          ( sleep 8; printf 'nettest local 18080\n'; sleep 25 ) | \
            timeout 80 qemu-system-aarch64 -M raspi3b -kernel kernel8.img \
              -serial stdio -display none -drive file=net.img,if=sd,format=raw \
              -device usb-net,netdev=n0 -netdev user,id=n0 > net.log 2>&1 || true
          cat net.log
          grep -q "PASS  dhcp"       net.log
          grep -q "PASS  arp+icmp"   net.log
          grep -q "PASS  websocket"  net.log
          grep -q " 0 failed"        net.log

      - name: Build the card image
        run: |
          SHORT=$(git rev-parse --short HEAD)
          ./tools/image/mkimage.sh "armtos-$SHORT.img" firmware
          gzip -9 -k "armtos-$SHORT.img"
          ls -la armtos-*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          SUBJECT=$(git log -1 --pretty=%s)
          gh release create "build-$SHORT" \
             --title "build @$SHORT" \
             --notes "$SUBJECT

          Write to an SD card with:
          \`\`\`
          gunzip -c armtos-$SHORT.img.gz | sudo dd of=/dev/sdX bs=4M conv=fsync
          \`\`\`
          Then connect a serial console to the header at 115200 baud (GPIO 14/15)." \
             "armtos-$SHORT.img.gz" \
             "kernel8.img"
